<div class="shell">
  <aside class="sidebar">
    <a class="brand" routerLink="/tasks" aria-label="To-Do App home">To-Do App</a>

    <div class="sidebar-footer" aria-label="Account actions">
      <app-theme-switcher />
      @if (authService.currentUser(); as user) {
        <span class="account-name">{{ user.displayName }}</span>
      }
      <div class="account-actions">
        <button type="button" class="logout-button btn btn-outline-secondary btn-sm" (click)="logout()">
          Sign out
        </button>
      </div>
    </div>

    <nav class="nav">
      <a routerLink="/tasks" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        Tasks
      </a>
      <a routerLink="/tasks/new" routerLinkActive="active">New Task</a>
      <a routerLink="/categories" routerLinkActive="active">Categories</a>
    </nav>
  </aside>

  <main class="content">
    <router-outlet></router-outlet>
  </main>
</div>
