<div class="shell">
  <header class="topbar">
    <a class="brand" routerLink="/tasks" aria-label="To-Do App home">To-Do App</a>

    <nav class="nav">
      <a routerLink="/tasks" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        Tasks
      </a>
      <a routerLink="/tasks/new" routerLinkActive="active">New Task</a>
    </nav>

    <div class="account-actions" aria-label="Account actions">
      <a routerLink="/login">Sign in</a>
      <a routerLink="/register">Sign up</a>
    </div>
  </header>

  <main class="content">
    <router-outlet></router-outlet>
  </main>
</div>
